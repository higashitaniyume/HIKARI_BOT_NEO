<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12152b">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236a6ff0'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='6' fill='url(%23g)'/%3E%3Cpath d='M12 5l1.6 4.4L18 11l-4.4 1.6L12 17l-1.6-4.4L6 11l4.4-1.6z' fill='white'/%3E%3C/svg%3E">
  <title>媒体详情解析</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef1f8;
      --surface: #ffffff;
      --surface-soft: #f5f7fc;
      --text: #171c28;
      --muted: #626c80;
      --line: #dfe4ef;
      --accent: #5a5ee0;
      --accent-strong: #4548c4;
      --accent-soft: #eef0fe;
      --accent-grad: linear-gradient(135deg, #6a6ff0, #8b5cf6);
      --warn: #9a6700;
      --error: #d1345b;
      --shadow: 0 14px 40px rgba(30, 41, 82, .08);
      --shadow-soft: 0 1px 3px rgba(30, 41, 82, .06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(58rem 32rem at 82% -14%, rgba(124, 131, 246, .14), transparent 62%),
        radial-gradient(46rem 30rem at -12% 88%, rgba(139, 92, 246, .08), transparent 60%),
        var(--bg);
      color: var(--text);
      font-family: "Inter", "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .app {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 30px 0 52px;
    }
    .topbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 22px;
      padding-bottom: 18px;
      position: relative;
    }
    .topbar::after {
      position: absolute;
      bottom: 0;
      left: 2px;
      width: 52px;
      height: 4px;
      border-radius: 999px;
      background: var(--accent-grad);
      content: "";
    }
    h1 {
      margin: 0;
      font-size: clamp(26px, 3.4vw, 38px);
      line-height: 1.08;
      font-weight: 800;
      letter-spacing: -.03em;
    }
    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }
    .platforms {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
      max-width: 560px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 5px 11px;
      border: 1px solid #c9cffb;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-strong);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .workspace {
      display: grid;
      grid-template-columns: minmax(300px, 420px) 1fr;
      gap: 18px;
      align-items: start;
    }
    .panel,
    .result-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow-soft);
    }
    .panel { padding: 18px; position: sticky; top: 16px; }
    label {
      display: block;
      margin-bottom: 8px;
      color: #3d4557;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .02em;
    }
    textarea {
      width: 100%;
      min-height: 190px;
      resize: vertical;
      border: 1px solid #c9d1e2;
      border-radius: 10px;
      padding: 12px 13px;
      font: 13.5px/1.55 ui-monospace, "Cascadia Code", SFMono-Regular, Consolas, "Liberation Mono", monospace;
      color: var(--text);
      background: #fbfcfe;
      outline: none;
      transition: border-color 130ms ease, box-shadow 130ms ease;
    }
    textarea:hover { border-color: #a9b4cf; }
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(90, 94, 224, .16);
    }
    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
    }
    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0;
      user-select: none;
    }
    .toggle input { width: 17px; height: 17px; accent-color: var(--accent); }
    button {
      min-height: 40px;
      border: 0;
      border-radius: 10px;
      padding: 0 18px;
      background: var(--accent-grad);
      box-shadow: 0 6px 16px rgba(90, 94, 224, .28);
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: filter 130ms ease, box-shadow 130ms ease;
    }
    button:hover { filter: brightness(1.07); box-shadow: 0 8px 22px rgba(90, 94, 224, .38); }
    button:disabled { opacity: .62; cursor: wait; }
    .status {
      min-height: 22px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }
    .messages {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
    }
    .notice {
      border: 1px solid #e8d8ae;
      border-radius: 10px;
      background: #fdf6e3;
      color: var(--warn);
      padding: 10px 14px;
      font-size: 13px;
    }
    .results {
      display: grid;
      gap: 14px;
    }
    .empty {
      min-height: 280px;
      display: grid;
      place-items: center;
      border: 1.5px dashed #c4cde0;
      border-radius: 14px;
      color: var(--muted);
      background: rgba(255, 255, 255, .55);
      text-align: center;
      padding: 22px;
    }
    .result-card { overflow: hidden; }
    .result-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      padding: 18px 18px 12px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(120deg, #ffffff 55%, #f6f7ff);
    }
    .platform {
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .title {
      margin: 4px 0 0;
      font-size: 20px;
      line-height: 1.25;
      font-weight: 780;
      letter-spacing: -.015em;
      overflow-wrap: anywhere;
    }
    .byline {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
      overflow-wrap: anywhere;
    }
    .summary {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      align-content: start;
    }
    .summary span {
      min-height: 28px;
      padding: 5px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface-soft);
      color: #3d4557;
      font-size: 12px;
      white-space: nowrap;
    }
    .result-body { padding: 14px 18px 18px; }
    .error {
      border: 1px solid #f3c2cf;
      border-radius: 10px;
      background: #fdeef2;
      color: var(--error);
      padding: 10px 14px;
      margin-bottom: 12px;
      font-size: 13px;
      overflow-wrap: anywhere;
    }
    .warns {
      display: grid;
      gap: 6px;
      margin-bottom: 12px;
    }
    .warn {
      color: var(--warn);
      background: #fdf6e3;
      border: 1px solid #e8d8ae;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 12px;
    }
    .description {
      white-space: pre-wrap;
      color: #33405a;
      font-size: 14px;
      line-height: 1.6;
      max-height: 220px;
      overflow: auto;
      margin-bottom: 12px;
    }
    .details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }
    .detail {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      background: var(--surface-soft);
    }
    .detail b {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 3px;
    }
    .detail span {
      display: block;
      font-size: 13px;
      overflow-wrap: anywhere;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }
    .tag {
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-strong);
      font-size: 12px;
    }
    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
    }
    .media-item {
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      background: var(--surface);
      transition: border-color 130ms ease, box-shadow 130ms ease;
    }
    .media-item:hover {
      border-color: #b3bce9;
      box-shadow: var(--shadow);
    }
    .media-preview {
      aspect-ratio: 16 / 11;
      background:
        repeating-conic-gradient(#eef0f7 0% 25%, #f8f9fd 0% 50%) 0 0 / 20px 20px;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .media-preview img,
    .media-preview video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #10142a;
    }
    .media-preview audio {
      width: calc(100% - 24px);
    }
    .media-missing {
      padding: 16px;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
      overflow-wrap: anywhere;
    }
    .media-meta {
      padding: 10px 12px;
      display: grid;
      gap: 8px;
    }
    .media-label {
      font-size: 13px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }
    .media-size {
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }
    .media-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .small-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 32px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--accent-strong);
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      transition: border-color 130ms ease, background 130ms ease;
    }
    .small-link:hover { border-color: #aab3e8; background: var(--accent-soft); }
    @media (max-width: 860px) {
      .topbar { display: block; }
      .platforms { justify-content: flex-start; margin-top: 12px; }
      .workspace { grid-template-columns: 1fr; }
      .panel { position: static; }
      .result-head { grid-template-columns: 1fr; }
      .summary { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>媒体详情解析</h1>
        <p class="subtitle">{{ bot_name }}</p>
      </div>
      <div class="platforms" id="platforms"></div>
    </header>

    <div class="workspace">
      <section class="panel">
        <form id="parseForm">
          <label for="urlInput">URL</label>
          <textarea id="urlInput" name="url" spellcheck="false"></textarea>
          <div class="controls">
            <label class="toggle"><input id="downloadInput" type="checkbox" checked> 自动下载媒体</label>
            <button id="parseButton" type="submit">解析</button>
          </div>
          <div class="status" id="status"></div>
        </form>
      </section>

      <section>
        <div class="messages" id="messages"></div>
        <div class="results" id="results">
          <div class="empty">等待 URL</div>
        </div>
      </section>
    </div>
  </main>

  <script>
    const form = document.getElementById('parseForm');
    const urlInput = document.getElementById('urlInput');
    const downloadInput = document.getElementById('downloadInput');
    const parseButton = document.getElementById('parseButton');
    const statusEl = document.getElementById('status');
    const messagesEl = document.getElementById('messages');
    const resultsEl = document.getElementById('results');
    const platformsEl = document.getElementById('platforms');

    function text(value) {
      return value === null || value === undefined ? '' : String(value);
    }

    function make(tag, className, value) {
      const el = document.createElement(tag);
      if (className) el.className = className;
      if (value !== undefined) el.textContent = text(value);
      return el;
    }

    function setStatus(value) {
      statusEl.textContent = value || '';
    }

    function formatBytes(size) {
      if (!size) return '';
      const units = ['B', 'KB', 'MB', 'GB'];
      let value = Number(size);
      let unit = 0;
      while (value >= 1024 && unit < units.length - 1) {
        value /= 1024;
        unit += 1;
      }
      return `${value.toFixed(unit ? 1 : 0)}${units[unit]}`;
    }

    function renderPlatforms(groups) {
      platformsEl.replaceChildren();
      (groups || []).forEach(group => {
        (group.platforms || []).forEach(name => {
          platformsEl.appendChild(make('span', 'chip', name));
        });
      });
    }

    function renderMessages(messages) {
      messagesEl.replaceChildren();
      (messages || []).forEach(message => {
        messagesEl.appendChild(make('div', 'notice', message));
      });
    }

    function renderResults(items) {
      resultsEl.replaceChildren();
      if (!items || !items.length) {
        resultsEl.appendChild(make('div', 'empty', '没有结果'));
        return;
      }
      items.forEach(item => resultsEl.appendChild(renderItem(item)));
    }

    function renderItem(item) {
      const card = make('article', 'result-card');
      const head = make('div', 'result-head');
      const titleWrap = make('div');
      titleWrap.appendChild(make('div', 'platform', item.platform || item.source || 'Media'));
      titleWrap.appendChild(make('h2', 'title', item.title || item.source_url || '未命名媒体'));
      const byline = [];
      if (item.author) byline.push(item.author);
      if (item.timestamp) byline.push(item.timestamp);
      if (item.source_url) byline.push(item.source_url);
      titleWrap.appendChild(make('div', 'byline', byline.join(' · ')));

      const summary = make('div', 'summary');
      const sum = item.summary || {};
      summary.appendChild(make('span', '', `视频 ${sum.videos || 0}`));
      summary.appendChild(make('span', '', `图片 ${sum.images || 0}`));
      summary.appendChild(make('span', '', `可下载 ${sum.downloaded || 0}`));
      (item.flags || []).forEach(flag => summary.appendChild(make('span', '', flag)));
      head.append(titleWrap, summary);
      card.appendChild(head);

      const body = make('div', 'result-body');
      if (item.error) body.appendChild(make('div', 'error', item.error));

      if (item.warnings && item.warnings.length) {
        const warns = make('div', 'warns');
        item.warnings.forEach(value => warns.appendChild(make('div', 'warn', value)));
        body.appendChild(warns);
      }

      if (item.description) body.appendChild(make('div', 'description', item.description));

      const details = make('div', 'details');
      (item.details || []).forEach(detail => {
        if (!detail || !detail.value) return;
        const row = make('div', 'detail');
        row.appendChild(make('b', '', detail.label || '字段'));
        row.appendChild(make('span', '', detail.value));
        details.appendChild(row);
      });
      if (details.childElementCount) body.appendChild(details);

      if (item.tags && item.tags.length) {
        const tags = make('div', 'tags');
        item.tags.forEach(tag => tags.appendChild(make('span', 'tag', `#${tag}`)));
        body.appendChild(tags);
      }

      const mediaGrid = make('div', 'media-grid');
      (item.media || []).forEach(media => mediaGrid.appendChild(renderMedia(media)));
      if (mediaGrid.childElementCount) body.appendChild(mediaGrid);
      card.appendChild(body);
      return card;
    }

    function renderMedia(media) {
      const box = make('div', 'media-item');
      const preview = make('div', 'media-preview');
      if (media.preview_url && media.kind === 'image') {
        const img = document.createElement('img');
        img.loading = 'lazy';
        img.src = media.preview_url;
        img.alt = media.label || media.filename || 'image';
        preview.appendChild(img);
      } else if (media.preview_url && media.kind === 'video') {
        const video = document.createElement('video');
        video.controls = true;
        video.preload = 'metadata';
        video.src = media.preview_url;
        preview.appendChild(video);
      } else if (media.preview_url && media.kind === 'audio') {
        const audio = document.createElement('audio');
        audio.controls = true;
        audio.src = media.preview_url;
        preview.appendChild(audio);
      } else {
        preview.appendChild(make('div', 'media-missing', media.skip_reason || '媒体不可预览'));
      }
      box.appendChild(preview);

      const meta = make('div', 'media-meta');
      meta.appendChild(make('div', 'media-label', media.label || media.filename || media.kind || 'media'));
      const bits = [media.filename, formatBytes(media.size_bytes), media.mode].filter(Boolean);
      if (bits.length) meta.appendChild(make('div', 'media-size', bits.join(' · ')));
      if (media.skip_reason) meta.appendChild(make('div', 'media-size', media.skip_reason));

      const actions = make('div', 'media-actions');
      if (media.download_url) {
        const dl = make('a', 'small-link', '下载');
        dl.href = media.download_url;
        dl.download = media.filename || '';
        actions.appendChild(dl);
      }
      if (media.source_url) {
        const open = make('a', 'small-link', '源地址');
        open.href = media.source_url;
        open.target = '_blank';
        open.rel = 'noreferrer';
        actions.appendChild(open);
      }
      if (actions.childElementCount) meta.appendChild(actions);
      box.appendChild(meta);
      return box;
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      parseButton.disabled = true;
      messagesEl.replaceChildren();
      resultsEl.replaceChildren(make('div', 'empty', '解析中'));
      setStatus(downloadInput.checked ? '正在解析并下载媒体...' : '正在解析媒体详情...');
      try {
        const response = await fetch('/api/parse', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            url: urlInput.value,
            download: downloadInput.checked
          })
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
        renderPlatforms(payload.platform_groups);
        renderMessages(payload.messages);
        renderResults(payload.items);
        setStatus(`完成：${(payload.items || []).length} 条结果`);
      } catch (error) {
        renderMessages([error.message || String(error)]);
        renderResults([]);
        setStatus('解析失败');
      } finally {
        parseButton.disabled = false;
      }
    });

    fetch('/api/platforms')
      .then(response => response.json())
      .then(payload => {
        renderPlatforms(payload.platform_groups);
        downloadInput.checked = Boolean(payload.auto_download);
      })
      .catch(() => {});
  </script>
</body>
</html>
