    <section class="view-panel" data-view="aiagent_quota" hidden>
      <section class="panel settings-panel">
        <div class="panel-heading">
          <div>
            <h2>AI 配额</h2>
            <p>群聊按群额度、私聊按个人额度（每日 + 每小时对话次数，0 = 不限额）。一条用户消息计 1 次对话；黑白名单优先于配额检查。</p>
          </div>
          <button type="button" id="quotaRefreshBtn" class="ghost">刷新</button>
        </div>

        <form id="quotaConfigForm" class="quota-form">
          <section class="quota-section">
            <div class="quota-section-head">
              <h3>基本设置</h3>
              <p>关闭时所有用户/群不设限。</p>
            </div>
            <label class="checkbox-field">
              <input id="quotaEnabled" type="checkbox">
              <span>启用 AI 配额</span>
            </label>
            <div class="quota-grid">
              <label>
                <span>用户每日次数</span>
                <input id="quotaDefaultUserDaily" type="number" min="0" step="1">
              </label>
              <label>
                <span>用户每小时次数</span>
                <input id="quotaDefaultUserHourly" type="number" min="0" step="1">
              </label>
              <label>
                <span>群每日次数</span>
                <input id="quotaDefaultGroupDaily" type="number" min="0" step="1">
              </label>
              <label>
                <span>群每小时次数</span>
                <input id="quotaDefaultGroupHourly" type="number" min="0" step="1">
              </label>
            </div>
            <label class="checkbox-field">
              <input id="quotaCountBackground" type="checkbox">
              <span>记忆总结等后台调用计入配额（只计不拦）</span>
            </label>
          </section>

          <section class="quota-section">
            <div class="quota-section-head">
              <h3>访问控制</h3>
              <p>黑白名单优先于配额：命中黑名单或在白名单之外的人/群直接不回复；豁免对象不设配额限制。</p>
            </div>
            <div class="quota-access-row">
              <label class="checkbox-field">
                <input id="quotaWhitelistEnabled" type="checkbox">
                <span>启用白名单（仅名单内可用）</span>
              </label>
              <label class="quota-two-col">
                <span>白名单 QQ 号（一行一个）</span>
                <textarea id="quotaWhitelistUsers" rows="3" placeholder="123456&#10;234567"></textarea>
              </label>
              <label class="quota-two-col">
                <span>白名单群号（一行一个）</span>
                <textarea id="quotaWhitelistGroups" rows="3" placeholder="987654321"></textarea>
              </label>
            </div>
            <div class="quota-access-row">
              <label class="checkbox-field">
                <input id="quotaBlacklistEnabled" type="checkbox">
                <span>启用黑名单（名单内禁止）</span>
              </label>
              <label class="quota-two-col">
                <span>黑名单 QQ 号（一行一个）</span>
                <textarea id="quotaBlacklistUsers" rows="3" placeholder="123456"></textarea>
              </label>
              <label class="quota-two-col">
                <span>黑名单群号（一行一个）</span>
                <textarea id="quotaBlacklistGroups" rows="3" placeholder="987654321"></textarea>
              </label>
            </div>
            <div class="quota-access-row">
              <label class="quota-two-col">
                <span>豁免用户 QQ 号（一行一个，不限额）</span>
                <textarea id="quotaExemptUsers" rows="3" placeholder="123456&#10;234567"></textarea>
              </label>
              <label class="quota-two-col">
                <span>豁免群号（一行一个，不限额）</span>
                <textarea id="quotaExemptGroups" rows="3" placeholder="987654321"></textarea>
              </label>
            </div>
          </section>

          <section class="quota-section">
            <div class="quota-section-head">
              <h3>定制限额</h3>
              <p>给指定用户/群设置独立对话次数（每日/每小时，0 = 不限额）。</p>
            </div>
            <div id="quotaOverrideList" class="quota-override-list">加载中...</div>
            <button type="button" id="quotaAddOverrideBtn" class="ghost quota-add-override">＋ 添加定制</button>
          </section>

          <button type="submit" class="primary">保存配额设置</button>
        </form>
      </section>

      <section class="panel settings-panel">
        <div class="panel-heading">
          <div>
            <h3>用量明细</h3>
            <p id="quotaUsageSummary">...</p>
          </div>
          <button type="button" id="quotaResetAllBtn" class="ghost">重置全部用量</button>
        </div>
        <div class="quota-tabs">
          <button type="button" class="quota-tab is-active" data-quota-tab="group">群聊</button>
          <button type="button" class="quota-tab" data-quota-tab="user">私聊用户</button>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>每日（已用 / 限额）</th>
                <th>每小时（已用 / 限额）</th>
                <th>剩余（每日）</th>
                <th>下次重置</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="quotaUsageTableBody">
              <tr><td colspan="6">加载中...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </section>
