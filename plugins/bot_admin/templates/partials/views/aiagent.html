    <section class="view-panel" data-view="aiagent" hidden>
      <section class="panel settings-panel">
        <div class="panel-heading">
          <div>
            <h2>AI Agent</h2>
            <p>支持 DeepSeek Responses API（服务端内置 web_search）与 OpenAI Chat Completions 兼容接口；未命中其他插件时，私聊直接回复，群聊需 @机器人。</p>
          </div>
        </div>

        <section class="profile-bar" aria-labelledby="aiagentProfileTitle">
          <div class="profile-bar-head">
            <div>
              <h3 id="aiagentProfileTitle">配置文件</h3>
              <p id="aiagentProfileSummary">正在读取配置文件。</p>
            </div>
            <label class="profile-bar-select">
              <span>正在编辑</span>
              <select id="aiagentProfileSelect"></select>
            </label>
          </div>
          <div class="profile-bar-actions">
            <button type="button" id="aiagentProfileCreateBtn" class="ghost">新建</button>
            <button type="button" id="aiagentProfileRenameBtn" class="ghost">重命名</button>
            <button type="button" id="aiagentProfileActivateBtn" class="ghost">设为默认</button>
            <button type="button" id="aiagentProfileDeleteBtn" class="ghost danger">删除</button>
          </div>
        </section>

        <form id="aiagentConfigForm" class="settings-form aiagent-form">
          <label class="checkbox-field settings-toggle">
            <input id="aiagentEnabled" type="checkbox">
            <span>启用聊天 Agent</span>
          </label>

          <label>
            <span>API 协议</span>
            <select id="aiagentProtocol">
              <option value="responses">Responses API（DeepSeek 新架构，内置 web_search）</option>
              <option value="chat_completions">Chat Completions（兼容旧接口）</option>
            </select>
          </label>

          <label>
            <span>API 地址</span>
            <input id="aiagentBaseUrl" placeholder="https://api.deepseek.com" required>
          </label>

          <label>
            <span>模型名称</span>
            <input id="aiagentModel" placeholder="deepseek-v4-flash" required>
          </label>

          <label>
            <span>API Key</span>
            <input id="aiagentApiKey" type="password" autocomplete="new-password" placeholder="留空表示不修改已有 Key">
            <small id="aiagentApiKeyHint">未配置</small>
          </label>

          <label>
            <span>代理</span>
            <input id="aiagentProxy" placeholder="http://127.0.0.1:7890">
          </label>

          <label>
            <span>请求超时（秒）</span>
            <input id="aiagentTimeout" type="number" min="5" max="600" step="1">
          </label>

          <label>
            <span>温度</span>
            <input id="aiagentTemperature" type="number" min="0" max="2" step="0.05">
          </label>

          <label>
            <span>Top P</span>
            <input id="aiagentTopP" type="number" min="0" max="1" step="0.05">
          </label>

          <label>
            <span>最大输出 Tokens</span>
            <input id="aiagentMaxTokens" type="number" min="1" max="32000" step="1">
          </label>

          <label>
            <span>人格 skill</span>
            <select id="aiagentPersonaSelect"></select>
            <small>只扫描 BotData/agent_personas 下的目录或文件。</small>
          </label>

          <label>
            <span>人格 skill 路径</span>
            <input id="aiagentPersonaPath" placeholder="BotData/agent_personas/default">
          </label>

          <label>
            <span>人格读取上限</span>
            <input id="aiagentPersonaMaxChars" type="number" min="1000" max="80000" step="500">
          </label>

          <label>
            <span>用户输入上限</span>
            <input id="aiagentMaxUserChars" type="number" min="1" max="20000" step="1">
          </label>

          <label>
            <span>回复长度上限</span>
            <input id="aiagentMaxReplyChars" type="number" min="100" max="12000" step="100">
          </label>

          <label>
            <span>历史消息数</span>
            <input id="aiagentMaxHistory" type="number" min="0" max="40" step="1">
          </label>

          <label>
            <span>用户冷却（秒）</span>
            <input id="aiagentCooldown" type="number" min="0" max="3600" step="1">
          </label>

          <label class="wide-field">
            <span>默认人格提示词</span>
            <textarea id="aiagentFallbackPrompt" rows="4" placeholder="当人格 skill 不存在或为空时使用"></textarea>
          </label>

          <label class="wide-field">
            <span>额外系统提示词</span>
            <textarea id="aiagentSystemExtra" rows="4" placeholder="可选，会追加在人格 skill 后"></textarea>
          </label>

          <label class="checkbox-field">
            <input id="aiagentGroupSharedContext" type="checkbox">
            <span>启用群聊公共上下文</span>
            <small>开启后，群内最近的公开对话（含其他成员）会作为背景提供给模型；默认关闭时每个成员只看自己的上下文。</small>
          </label>

          <label>
            <span>公共上下文消息数</span>
            <input id="aiagentGroupSharedMax" type="number" min="0" max="40" step="1">
          </label>

          <section class="wide-field aiagent-tools-block" aria-labelledby="aiagentVisionTitle">
            <div class="aiagent-tools-head">
              <div>
                <h3 id="aiagentVisionTitle">思考与图片输入</h3>
                <p>图片输入需要模型本身支持视觉（例如 deepseek-v4-flash-vision-exp）；模型拒绝图片时会自动去掉图片重发一次，不会让机器人失声。</p>
              </div>
              <div class="aiagent-tools-controls">
                <label class="checkbox-field">
                  <input id="aiagentThinkingEnabled" type="checkbox">
                  <span>启用思考模式</span>
                </label>
                <label>
                  <span>思考强度</span>
                  <select id="aiagentReasoningEffort">
                    <option value="low">low</option>
                    <option value="medium">medium</option>
                    <option value="high">high</option>
                    <option value="max">max</option>
                  </select>
                </label>
                <label class="checkbox-field">
                  <input id="aiagentVisionEnabled" type="checkbox">
                  <span>启用图片输入</span>
                </label>
                <label class="checkbox-field">
                  <input id="aiagentVisionIncludeQuoted" type="checkbox">
                  <span>连带读取被引用消息里的图片</span>
                </label>
                <label>
                  <span>单次最多图片数</span>
                  <input id="aiagentVisionMaxImages" type="number" min="1" max="8" step="1">
                </label>
                <label>
                  <span>图片精度</span>
                  <select id="aiagentVisionDetail">
                    <option value="low">low（512×512，最省 token）</option>
                    <option value="high">high</option>
                    <option value="original">original</option>
                    <option value="auto">auto</option>
                  </select>
                </label>
                <label>
                  <span>单张图片上限（KB）</span>
                  <input id="aiagentVisionMaxKb" type="number" min="64" max="32768" step="64">
                </label>
                <label>
                  <span>图片下载超时（秒）</span>
                  <input id="aiagentVisionTimeout" type="number" min="3" max="120" step="1">
                </label>
              </div>
            </div>
          </section>

          <section class="wide-field aiagent-tools-block" aria-labelledby="aiagentToolsTitle">
            <div class="aiagent-tools-head">
              <div>
                <h3 id="aiagentToolsTitle">Tools 管理</h3>
                <p id="aiagentToolSummary">正在读取可用工具。</p>
              </div>
              <div class="aiagent-tools-controls">
                <label class="checkbox-field">
                  <input id="aiagentPluginToolsEnabled" type="checkbox">
                  <span>启用插件 Tools</span>
                </label>
                <label class="checkbox-field">
                  <input id="aiagentAllowSideEffectTools" type="checkbox">
                  <span>允许副作用 Tools</span>
                </label>
                <label class="checkbox-field">
                  <input id="aiagentAllowFileWrites" type="checkbox">
                  <span>允许 AI 写 UserData 文件</span>
                </label>
                <label>
                  <span>网页搜索</span>
                  <select id="aiagentSearchMode">
                    <option value="builtin">DeepSeek 内置搜索（服务端执行）</option>
                    <option value="searxng">自建 SearXNG</option>
                  </select>
                </label>
                <label>
                  <span>选择模式</span>
                  <select id="aiagentToolSelectionMode">
                    <option value="default">默认启用，逐个禁用</option>
                    <option value="allowlist">只启用勾选项</option>
                  </select>
                </label>
                <label>
                  <span>最大 Tool 轮次</span>
                  <input id="aiagentMaxToolRounds" type="number" min="0" max="50" step="1">
                  <small>单次对话中 AI 调用工具的最大轮次（0=禁用工具调用）</small>
                </label>
                <label>
                  <span>单个 Tool 超时（秒）</span>
                  <input id="aiagentToolTimeout" type="number" min="0.1" max="600" step="0.1">
                  <small>单个工具调用超过该时长即按工具报错处理，不再拖住整轮回复</small>
                </label>
              </div>
            </div>
            <div id="aiagentToolList" class="aiagent-tool-list" aria-live="polite"></div>
          </section>

          <button type="submit" class="primary">保存 AI Agent 设置</button>
        </form>
      </section>

      <section class="panel settings-panel">
        <div class="panel-heading">
          <div>
            <h3>会话绑定</h3>
            <p id="aiagentBindingSummary">给指定群或私聊指定配置文件；未绑定的会话使用全局默认配置。</p>
          </div>
          <button type="button" id="aiagentBindingAddBtn" class="ghost">＋ 添加绑定</button>
        </div>
        <div class="quota-tabs">
          <button type="button" class="quota-tab is-active" data-binding-tab="group">群聊</button>
          <button type="button" class="quota-tab" data-binding-tab="private">私聊用户</button>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>群号 / QQ 号</th>
                <th>使用的配置文件</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="aiagentBindingTableBody">
              <tr><td colspan="3">加载中...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </section>
